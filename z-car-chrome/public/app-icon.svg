<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Z CAR">
  <!--
    Z CAR のアプリアイコン。オーナーのタント(L375S・ベージュ)を、
    ヘッドライトが目・グリルが笑顔になった可愛いキャラクターとして描いた。
    背が高く角ばった箱形・大きなガラス・短いボンネットというタントらしさは残す。
    実車のナンバーやエンブレム、文字は入れていない。
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16262d"/>
      <stop offset="1" stop-color="#050a0c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="44%" r="58%">
      <stop offset="0" stop-color="#2ea7b4" stop-opacity=".42"/>
      <stop offset="1" stop-color="#2ea7b4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1=".16" y1="0" x2=".88" y2="1">
      <stop offset="0" stop-color="#ead79f"/>
      <stop offset=".4" stop-color="#d6b87b"/>
      <stop offset=".78" stop-color="#b89852"/>
      <stop offset="1" stop-color="#8f7038"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8ecc6" stop-opacity=".9"/>
      <stop offset="1" stop-color="#f8ecc6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1=".12" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#33555f"/>
      <stop offset=".5" stop-color="#1d3038"/>
      <stop offset="1" stop-color="#15242a"/>
    </linearGradient>
    <linearGradient id="lamp" x1=".2" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#eef6f8"/>
      <stop offset="1" stop-color="#cbdde2"/>
    </linearGradient>
    <radialGradient id="iris" cx="40%" cy="32%" r="74%">
      <stop offset="0" stop-color="#5fc9dd"/>
      <stop offset=".6" stop-color="#2a8fa8"/>
      <stop offset="1" stop-color="#1b5e73"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- 小さく表示したときに埋もれないよう、車体を一回り大きくして中央に置く。 -->
  <g transform="translate(-27,-44.4) scale(1.1)">
  <!-- 接地の影 -->
  <ellipse cx="256" cy="448" rx="174" ry="24" fill="#000" opacity=".45"/>

  <!-- ドアミラー(付け根は車体で隠れる) -->
  <g fill="#c2a566" stroke="#6b5324" stroke-width="6" stroke-linejoin="round">
    <path d="M100 250l-30 6c-9 2-13 10-9 18 3 6 9 9 16 8l25-4z"/>
    <path d="M412 250l30 6c9 2 13 10 9 18-3 6-9 9-16 8l-25-4z"/>
  </g>

  <!-- 車体(背の高い箱形) -->
  <path d="M124 94h264c25 0 40 16 42 45l6 256c1 25-12 39-36 39H112c-24 0-37-14-36-39l6-256c2-29 17-45 42-45z"
        fill="url(#body)" stroke="#6b5324" stroke-width="8" stroke-linejoin="round"/>

  <!-- ルーフレール -->
  <g fill="#f4e5b6" opacity=".8">
    <rect x="132" y="98" width="52" height="10" rx="5"/>
    <rect x="328" y="98" width="52" height="10" rx="5"/>
  </g>

  <!-- フロントガラス -->
  <path d="M141 130h230c11 0 18 7 19 18l7 108c1 12-6 20-18 20H133c-12 0-19-8-18-20l7-108c1-11 8-18 19-18z"
        fill="url(#glass)" stroke="#111c20" stroke-width="12" stroke-linejoin="round"/>
  <path d="M168 138h52l-60 130h-34l10-112c1-11 8-18 19-18z" fill="#7fd3dd" opacity=".15"/>
  <path d="M262 138h28l-60 130h-28z" fill="#7fd3dd" opacity=".09"/>

  <!-- ワイパー -->
  <g stroke="#1b2226" stroke-width="10" stroke-linecap="round" opacity=".9">
    <path d="M152 296l96-16"/>
    <path d="M256 296l96-16"/>
  </g>

  <!-- ボンネットの艶 -->
  <path d="M104 298c48-11 256-11 304 0l-4 20c-56-10-240-10-296 0z" fill="url(#hood)"/>

  <!-- 目(ヘッドライト) -->
  <g stroke="#5d4a22" stroke-width="7">
    <ellipse cx="154" cy="338" rx="54" ry="38" fill="url(#lamp)"/>
    <ellipse cx="358" cy="338" rx="54" ry="38" fill="url(#lamp)"/>
  </g>
  <circle cx="121" cy="356" r="11" fill="#f0a73c" opacity=".55"/>
  <circle cx="391" cy="356" r="11" fill="#f0a73c" opacity=".55"/>
  <circle cx="166" cy="340" r="26" fill="url(#iris)"/>
  <circle cx="346" cy="340" r="26" fill="url(#iris)"/>
  <circle cx="166" cy="340" r="14" fill="#0d161a"/>
  <circle cx="346" cy="340" r="14" fill="#0d161a"/>
  <circle cx="157" cy="331" r="9" fill="#fff"/>
  <circle cx="337" cy="331" r="9" fill="#fff"/>
  <circle cx="174" cy="350" r="5" fill="#fff" opacity=".55"/>
  <circle cx="354" cy="350" r="5" fill="#fff" opacity=".55"/>

  <!-- ほっぺ -->
  <ellipse cx="120" cy="392" rx="25" ry="11" fill="#d9705f" opacity=".32"/>
  <ellipse cx="392" cy="392" rx="25" ry="11" fill="#d9705f" opacity=".32"/>

  <!-- 口(グリルが笑顔) -->
  <path d="M178 384q78 44 156 0" fill="none" stroke="#182024" stroke-width="18" stroke-linecap="round"/>

  <!-- バンパー下の黒い帯 -->
  <path d="M84 428h344l-2 6c-2 12-10 18-24 18H110c-14 0-22-6-24-18z" fill="#10161a"/>
  </g>
</svg>
