<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Z CAR">
  <!-- 設定の歯車の中にメーターを入れたアイコン。面と太い線だけで、小さくても形が残る。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1a1f"/>
      <stop offset="1" stop-color="#05090b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- 歯車 -->
  <g fill="#3ddfe6">
    <g>
      <rect x="225" y="34" width="62" height="56" rx="12"/>
      <rect x="225" y="34" width="62" height="56" rx="12" transform="rotate(45 256 256)"/>
      <rect x="225" y="34" width="62" height="56" rx="12" transform="rotate(90 256 256)"/>
      <rect x="225" y="34" width="62" height="56" rx="12" transform="rotate(135 256 256)"/>
      <rect x="225" y="34" width="62" height="56" rx="12" transform="rotate(180 256 256)"/>
      <rect x="225" y="34" width="62" height="56" rx="12" transform="rotate(225 256 256)"/>
      <rect x="225" y="34" width="62" height="56" rx="12" transform="rotate(270 256 256)"/>
      <rect x="225" y="34" width="62" height="56" rx="12" transform="rotate(315 256 256)"/>
    </g>
    <circle cx="256" cy="256" r="182"/>
  </g>
  <circle cx="256" cy="256" r="138" fill="#0a1216"/>

  <!-- メーター -->
  <path d="M173 304A96 96 0 1 1 339 304" fill="none" stroke="#7ff2f8" stroke-width="17" stroke-linecap="round"/>
  <path d="M256 256l50-72" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="15" fill="#ffffff"/>
</svg>
