# mainブランチが更新されるたびに、アプリを自動ビルドして
# エックスサーバーへFTPSでアップロードするワークフローです。
#
# 動かすには、GitHubリポジトリの Settings → Secrets and variables →
# Actions → New repository secret で次の4つを登録してください:
#   FTP_SERVER     : FTPサーバー名 (例: sv12345.xserver.jp)
#   FTP_USERNAME   : FTPユーザー名 (サーバーID または FTPアカウント名)
#   FTP_PASSWORD   : FTPパスワード
#   FTP_TARGET_DIR : アップロード先 (例: /example.com/public_html/zcar/)
name: Deploy to Xserver

on:
  push:
    branches: [main]
  workflow_dispatch: # Actionsタブから手動実行も可能

concurrency:
  group: deploy-xserver
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: z-car-chrome
        run: npm ci --no-audit --no-fund

      - name: Build static site
        working-directory: z-car-chrome
        env:
          # 公開先のサブフォルダ名。FTPアカウントの接続先ディレクトリ
          # (…/public_html/zcar)と一致させること。
          BASE_PATH: /zcar
        run: npm run build:static

      # サーバーへのFTPS接続はまれにタイムアウトするため、
      # 1回目が失敗したら自動でもう一度だけ試す。
      - name: Upload via FTPS
        id: deploy
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          timeout: 120000
          local-dir: z-car-chrome/out/
          server-dir: ${{ secrets.FTP_TARGET_DIR }}

      - name: Upload via FTPS (retry)
        if: steps.deploy.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          timeout: 120000
          local-dir: z-car-chrome/out/
          server-dir: ${{ secrets.FTP_TARGET_DIR }}
